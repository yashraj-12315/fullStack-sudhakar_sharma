<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function loginClick() {
        var username = document.getElementById("txtUser").value;
        var password = document.getElementById("txtPwd").value;
        var msg = document.querySelector("p");
        if (username.length === 0) {
          msg.innerHTML = "Username required";
        } else {
          if (username === "yashraj") {
            if (password.length === 0) {
              msg.innerHTML = "Password is required";
            } else {
              if (password === "Yash@123") {
                document.write("<h2>Login Success</h2>");
              } else {
                msg.innerHTML = "Invalid password";
              }
            }
          } else {
            msg.innerHTML = "Invalid username";
          }
        }
      }
    </script>
  </head>
  <body>
    <dl>
      <dt>User Name</dt>
      <dd><input type="text" id="txtUser" /></dd>
      <dt>Password</dt>
      <dd><input type="password" id="txtPwd" /></dd>
    </dl>
    <button onclick="loginClick()">Login</button>
    <p style="color: red"></p>
  </body>
</html>

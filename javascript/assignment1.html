<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      var position = 1;
      function leftClick() {
        position /= 5;
        document.querySelector("img").style.marginLeft = position + "px";
      }
      function rightClick() {
        position *= 5;
        document.querySelector("img").style.marginLeft = position + "px";
      }
    </script>
  </head>
  <body>
    <button onclick="leftClick()">&lt;</button>
    <button onclick="rightClick()">&gt;</button>
    <br /><br />
    <img src="../public/images/women-fashion.jpg" width="100" height="100" />
  </body>
</html>

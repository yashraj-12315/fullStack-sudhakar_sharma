<!-- Cookies -->

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function bodyload() {
        if (document.cookie === "") {
          location.href = "./login.html";
        } else {
          document.getElementById("lblName").innerHTML = document.cookie.slice(
            document.cookie.indexOf("=") + 1
          );
        }
      }

      function signoutClick() {
        document.cookie = `Username = ""; expires=Sun, 25  Jul 2025 06:46:07 GMT`;
        location.href = "./login.html";
      }
    </script>
  </head>
  <body onload="bodyload()">
    <h2>
      <span id="lblName"></span> - Dashboard -
      <button onclick="signoutClick()">Signout</button>
    </h2>
  </body>
</html>

<script>
  var now = new Date();

  now.setHours(10);
  var hrs = now.getHours();

  if (hrs >= 0 && hrs <= 12) {
    document.write("<h2>Good Morning</h2>");
  } else if (hrs >= 13 && hrs <= 17) {
    document.write("<h2>Good Afternoon</h2>");
  } else {
    document.write("<h2>Good Evening</h2>");
  }
</script>

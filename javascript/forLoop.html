  // Write a program to print a triangle of "*" for specified number.

  function printPattern(n) {
    for (var i = 1; i <= n; i++) {
      for (var j = 1; j <= i; j++) {
        document.write("*" + " ");
      }
      document.write("<br>");
    }
  }
  //   printPattern(parseInt(prompt("Enter number")));

  function printReversePattern(n) {
    for (var i = n; i >= 0; i--) {
      for (var j = 1; j <= i; j++) {
        document.write(`* &nbsp;`);
      }
      document.write("<br>");
    }
  }
  //   printReversePattern(parseInt(prompt("Enter number")));

  var rows = 5;
  var pyramid = "";

  for (var i = 1; i <= rows; i++) {
    for (var j = 1; j <= rows - i; j++) {
      pyramid += "&nbsp;";
    }

    for (var k = 1; k <= 2 * i - 1; k++) {
      pyramid += "*";
    }

    pyramid += "<br>";
  }

  document.write(pyramid);
</script>

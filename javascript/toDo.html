<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="../src/scripts/toDo.js"></script>
  </head>
  <body class="container-fluid" onload="bodyLoad()">
    <header class="bg-secondary text-white py-3">
      <h3 class="text-center">To-Do</h3>
      <p class="text-center">Your Appointments</p>
    </header>
    <div class="mt-3 w-50">
      <div class="input-group">
        <input
          id="txtTask"
          type="text"
          placeholder="New Appointment"
          class="form-control"
        />
        <button
          onclick="addClick()"
          class="bi bi-calendar-date btn btn-primary input-group-text"
        >
          Add
        </button>
      </div>
      <div class="my-4">
        <label class="form-label fw-bold"
          >Your Appointments
          <button
            class="bi bi-sort-alpha-down btn btn-success"
            onclick="sortAsc()"
          ></button>
          <button
            class="bi bi-sort-alpha-up btn btn-success"
            onclick="sortDesc()"
          ></button
        ></label>
        <select class="form-select" size="3" id="lstAppointments"></select>
        <label id="lblCount" class="form-label fw-bold"></label>
      </div>
      <div class="mt-3">
        <button
        onclick="editClick()"
          data-bs-target="#edit"
          data-bs-toggle="modal"
          class="btn btn-warning bi bi-pen-fill"
        >
          Edit
        </button>
        <div class="modal fade" id="edit">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h4>Edit Appointment</h4>
                <button class="btn btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <input type="text" id="txtEdit" class="form-control">
              </div>
              <div class="modal-footer">
                <button onclick="saveClick()" data-bs-dismiss="modal" class="btn btn-success">Save Appointment</button>
              </div>
            </div>
          </div>
        </div>
        <button onclick="deleteClick()" class="btn btn-danger bi bi-trash-fill">
          Delete
        </button>
        <button
          onclick="clearAll()"
          class="btn btn-outline-danger bi bi-trash-fill"
        >
          Clear All
        </button>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <style>
      body {
        height: 100vh;
      }
      .weather-container {
        width: 600px;
        height: 400px;
        background-image: url("../public/images/weather.webp");
        background-size: cover;
      }
      .noshade {
        background-color: rgba(0, 0, 0, 0.5);
        width: 600px;
        height: 400px;
        color: white;
      }
    </style>
    <script>
      function getWeatherData(city) {
        document.getElementById("detailsContainer").style.display = "block";
        var api_url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=930efe02af745d754f9fcfe2368c3310&units=metric`;
        fetch(api_url)
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            document.getElementById("lblCity").innerHTML = data.name;
            document.getElementById("lbltemp").innerHTML =
              data.main.temp.toFixed(0) + "&deg;C";
            document.getElementById("lblFeel").innerHTML = data.weather[0].main;
            document.getElementById("lblWind").innerHTML =
              data.wind.speed + " KMPH";
          })
          .catch(function (error) {
            console.log(error);
          });
      }

      function searchClick() {
        var cityName = document.getElementById("txtCity").value;
        getWeatherData(cityName);
        document.getElementById("txtCity").value = "";
      }

      function getWeather() {
        var cityName = document.getElementById("lstCities").value;
        getWeatherData(cityName);
      }
    </script>
  </head>
  <body
    class="container-fluid d-flex justify-content-center align-items-center"
  >
    <div class="weather-container">
      <div class="noshade p-4">
        <div>
          <div class="input-group">
            <select onchange="getWeather()" class="form-select" id="lstCities">
              <option>Select City</option>
              <option>Patna</option>
              <option>Delhi</option>
              <option>Mumbai</option>
              <option>Hyderabad</option>
              <option>Bangalore</option>
            </select>
            <input
              type="text"
              class="form-control w-50"
              id="txtCity"
              placeholder="City name"
            />
            <button
              onclick="searchClick()"
              class="btn btn-warning bi bi-search"
            ></button>
          </div>
        </div>
        <div class="mt-4" id="detailsContainer" style="display: none">
          <div id="lblCity" class="my-4 fs-2 fw-bold"></div>
          <div>
            <span class="bi bi-cloud-haze fs-1"></span>
            <span id="lbltemp" class="fs-1 fw-bold"></span>
          </div>
          <div id="lblFeel" class="d-inline"></div>
          <span id="lblWind"></span>
        </div>
      </div>
    </div>
  </body>
</html>

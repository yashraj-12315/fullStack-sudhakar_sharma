      // Write a function to print string in sentence case (the first letter uppercase and all other letters should be in lowerCase) o/p: Welcome

      function changeCase(str) {
        var firstChar = str.charAt(0);
        var restChars = str.slice(1);
        var sentence = firstChar.toUpperCase() + restChars.toLowerCase();
        document.write(sentence);
      }
      changeCase(prompt("Enter Sentence"));
    </script>
